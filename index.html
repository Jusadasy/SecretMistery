<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tercer Misterio ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

overflow:hidden;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,#180000,#430000,#6b001d,#250000);

background-size:400% 400%;

animation:fondo 14s linear infinite;

color:white;

}

/*============================*/

@keyframes fondo{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/*============================*/

#particulas{

position:fixed;

inset:0;

pointer-events:none;

overflow:hidden;

}

/*============================*/

.estrella{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

opacity:.8;

animation:brillo 3s infinite alternate;

}

@keyframes brillo{

from{

opacity:.2;

transform:scale(.6);

}

to{

opacity:1;

transform:scale(1.5);

}

}

/*============================*/

.corazon{

position:absolute;

font-size:22px;

animation:subir linear forwards;

pointer-events:none;

opacity:.8;

}

@keyframes subir{

from{

transform:translateY(0);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

/*============================*/

.rosa{

position:fixed;

font-size:70px;

opacity:.75;

animation:girar 18s linear infinite;

filter:drop-shadow(0 0 12px crimson);

}

@keyframes girar{

100%{

transform:rotate(360deg);

}

}

.r1{

top:20px;

left:20px;

}

.r2{

top:20px;

right:20px;

}

.r3{

bottom:20px;

left:20px;

}

.r4{

bottom:20px;

right:20px;

}

/*============================*/

#panel{

width:760px;

max-width:92%;

padding:45px;

border-radius:30px;

background:rgba(255,255,255,.10);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.20);

box-shadow:

0 0 40px rgba(255,0,80,.25);

text-align:center;

}

/*============================*/

h1{

font-size:45px;

margin-bottom:15px;

text-shadow:

0 0 15px crimson,

0 0 35px red;

}

#minecraft{

margin:25px 0;

font-size:28px;

letter-spacing:4px;

color:#ffd7d7;

}

/*============================*/

input{

width:320px;

max-width:90%;

padding:15px;

border:none;

border-radius:15px;

outline:none;

text-align:center;

font-size:18px;

margin-top:20px;

}

/*============================*/

button{

margin-top:20px;

padding:15px 40px;

border:none;

border-radius:15px;

background:crimson;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

/*============================*/

#contador{

display:none;

font-size:40px;

font-weight:bold;

margin-top:25px;

}

/*============================*/

#carta{

display:none;

margin-top:35px;

padding:35px;

border-radius:25px;

background:rgba(255,255,255,.13);

border:1px solid rgba(255,255,255,.20);

backdrop-filter:blur(18px);

text-align:left;

line-height:1.9;

font-size:20px;

white-space:pre-line;

max-height:60vh;

overflow:auto;

box-shadow:

0 0 30px rgba(255,0,90,.35);

transform:scale(.5);

opacity:0;

transition:1s;

}
/*==============================
      VENTANA DE LA CARTA
==============================*/

#overlay{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.65);

backdrop-filter:blur(10px);

opacity:0;

visibility:hidden;

transition:.5s;

z-index:999;

}

#overlay.activo{

opacity:1;

visibility:visible;

}

#ventana{

width:800px;

max-width:90%;

max-height:80vh;

overflow:auto;

padding:40px;

background:rgba(255,255,255,.95);

border-radius:30px;

box-shadow:0 0 45px crimson;

color:#222;

line-height:1.9;

font-size:20px;

white-space:pre-line;

transform:scale(.4);

opacity:0;

transition:.6s cubic-bezier(.18,1.2,.35,1);

}

#overlay.activo #ventana{

transform:scale(1);

opacity:1;

}
</style>

</head>

<body>

<div id="particulas"></div>

<div class="rosa r1">🌹</div>
<div class="rosa r2">🌹</div>
<div class="rosa r3">🌹</div>
<div class="rosa r4">🌹</div>
<!--==================================================
                PANEL PRINCIPAL
===================================================-->

<div id="panel">

    <h1>❤️ Tercer Misterio ❤️</h1>

    <p>
        Si has llegado hasta aquí, significa que has conseguido resolver
        todos los misterios anteriores...
    </p>

    <p style="margin-top:20px;">
        Descifra la siguiente palabra escrita con el idioma de la mesa
        de encantamientos de Minecraft.
    </p>

    <h2 id="minecraft">

        ᔑᒷリᒷᓵᒷᓭ╎ℸ ̣ 𝙹ᒷリᒲ╎⍊╎↸ᔑ

    </h2>

    <input
        id="respuesta"
        type="text"
        placeholder="Escribe la palabra secreta">

    <br>

    <button onclick="comprobar()">

        Desbloquear Carta

    </button>

    <div id="contador">

        10

    </div>

    <div id="carta"></div>

</div>
<div id="overlay">

<div id="ventana"></div>

</div>
<audio id="musica" loop>

    <source src="lucy.mp3" type="audio/mpeg">

</audio>

<script>

/*==================================================
                CARTA
==================================================*/

const carta = `Hola Soraya,

¿Has llegado hasta aquí? Me impresionas, la verdad, aunque ya lo hacías jejeje.

Me alegro mucho de haberte conocido. Eres una gran persona en mi vida y quiero decirte que te amo desde hace un tiempo.

Eres una persona tan maravillosa que llegué a pensar que jamás te ibas a enamorar de alguien como yo.

Quiero que sepas que, aunque a veces no demuestre todo lo que siento, no paro de pensarte.

No paro de soñarte e incluso hay veces que escribo mensajes donde digo todo lo que siento, lo perfecta que eres y recuerdo aquellas noches en las que nos quedábamos hasta tarde hablando por llamada.

Esos momentos los guardo como un tesoro.

Te amo muchísimo y no me gustaría perderte nunca.

No te escribo esto para pedirte nada.

Solo quería que supieras lo importante que eres para mí.

Atentamente:

Jairo ❤️`;
  /*==================================================
            CORAZONES FLOTANDO
==================================================*/

setInterval(()=>{

    const c=document.createElement("div");

    c.className="corazon";

    c.innerHTML=Math.random()>0.5?"❤️":"💕";

    c.style.left=Math.random()*100+"vw";

    c.style.bottom="-40px";

    c.style.fontSize=(18+Math.random()*28)+"px";

    c.style.animationDuration=(6+Math.random()*5)+"s";

    document.body.appendChild(c);

    setTimeout(()=>{

        c.remove();

    },11000);

},350);

/*==================================================
            PARTÍCULAS BRILLANTES
==================================================*/

const fondo=document.getElementById("particulas");

for(let i=0;i<120;i++){

    const e=document.createElement("div");

    e.className="estrella";

    e.style.left=Math.random()*100+"vw";

    e.style.top=Math.random()*100+"vh";

    e.style.animationDelay=Math.random()*3+"s";

    fondo.appendChild(e);

}

/*==================================================
            COMPROBAR PALABRA
==================================================*/

function comprobar(){

    const texto=document
    .getElementById("respuesta")
    .value
    .replace(/\s/g,"")
    .toLowerCase();

    if(texto!="tenecesitoenmivida"){

        alert("La palabra no es correcta ❤️");

        return;

    }

    document.getElementById("musica").play();

    mostrarCarta();

}

/*==================================================
            CARTA
==================================================*/

function mostrarCarta(){

const overlay=document.getElementById("overlay");

const ventana=document.getElementById("ventana");

overlay.classList.add("activo");

ventana.innerHTML="";

let i=0;

const escribir=setInterval(()=>{

ventana.innerHTML+=carta.charAt(i);

ventana.scrollTop=ventana.scrollHeight;

i++;

if(i>=carta.length){

clearInterval(escribir);

iniciarContador();

}

},28);

}

/*==================================================
            CONTADOR
==================================================*/

function iniciarContador(){

    let tiempo=10;

    const contador=document.getElementById("contador");

    contador.style.display="block";

    contador.innerHTML=tiempo;

    const reloj=setInterval(()=>{

        tiempo--;

        contador.innerHTML=tiempo;

        if(tiempo<=0){

            clearInterval(reloj);

            cerrarCarta();

        }

    },1000);

}

/*==================================================
            CERRAR
==================================================*/

function cerrarCarta(){

let tiempo=0;

const overlay=document.getElementById("overlay");

const ventana=document.getElementById("ventana");

const cerrar=setInterval(()=>{

tiempo+=0.03;

ventana.style.transform=`scale(${1-tiempo})`;

ventana.style.opacity=1-tiempo;

if(tiempo>=1){

clearInterval(cerrar);

overlay.classList.remove("activo");

explosion();

}

},20);

}

/*==================================================
            EXPLOSIÓN
==================================================*/

function explosion(){

    for(let i=0;i<180;i++){

        const p=document.createElement("div");

        p.innerHTML=Math.random()>0.5?"❤️":"🌹";

        p.style.position="fixed";

        p.style.left=(window.innerWidth/2)+"px";

        p.style.top=(window.innerHeight/2)+"px";

        p.style.fontSize=(18+Math.random()*18)+"px";

        p.style.pointerEvents="none";

        document.body.appendChild(p);

        const x=(Math.random()-0.5)*1200;

        const y=(Math.random()-0.5)*1200;

        p.animate([

            {

                transform:"translate(0,0) scale(1)",

                opacity:1

            },

            {

                transform:`translate(${x}px,${y}px) scale(0)`,

                opacity:0

            }

        ],{

            duration:2500,

            easing:"ease-out"

        });

        setTimeout(()=>{

            p.remove();

        },2500);

    }

}

document
.getElementById("respuesta")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"){

        comprobar();

    }

});

</script>

</body>

</html>
